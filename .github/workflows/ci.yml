name: CI

# The gate set. scripts/release.mjs's printGatesChecklist() prints the same
# list for the release preflight and release.yml runs it before every build —
# change all three in the same commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repo. (release.yml separately needs
# contents: write to upload assets.)
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The five version files (package.json, tauri.conf.json, Cargo.toml,
      # Cargo.lock, src/version.ts) must agree — src/version.ts drifted for
      # ten releases once because nothing checked.
      - run: node scripts/bump-version.mjs --verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  rust:
    # The Rust shell has real logic now (library scan, loopback capture,
    # ProRes sidecar manager) — test it on the actual target platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri's build script validates externalBin + frontend dist at
      # COMPILE time, so even `cargo test` needs all of them present.
      # The lyrics pipeline (FEAT-004) adds whisper-cli + onnxruntime
      # fetches and the sidecar build to that set.
      - run: node scripts/fetch-ffmpeg.mjs
      - run: node scripts/fetch-whisper.mjs
      - run: node scripts/fetch-onnxruntime.mjs
      - run: node scripts/build-lyrics-sidecar.mjs
      - run: npm run build
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      # --workspace everywhere below: src-tauri is a non-virtual workspace
      # root, so bare cargo commands cover ONLY the app package and would
      # silently skip the lyrics sidecar (a bin-target member — its whole
      # test suite lives under --bins).
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --workspace --lib --bins
        working-directory: src-tauri

  audit:
    # Dependency vulnerabilities, both ecosystems. Non-blocking would defeat
    # the point, so these fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri
