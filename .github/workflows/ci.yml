name: CI

# Gate set implemented here is DEFINED in GATES.md (§1, §2, §5) — change
# gates there first, then here and in release.yml in the same commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repo. (release.yml separately needs
# contents: write to upload assets.)
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  rust:
    # The Rust shell has real logic now (library scan, loopback capture,
    # ProRes sidecar manager) — test it on the actual target platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri's build script validates externalBin + frontend dist at
      # COMPILE time, so even `cargo test` needs all of them present.
      # The lyrics pipeline (FEAT-004) adds whisper-cli + onnxruntime
      # fetches and the sidecar build to that set.
      - run: node scripts/fetch-ffmpeg.mjs
      - run: node scripts/fetch-whisper.mjs
      - run: node scripts/fetch-onnxruntime.mjs
      - run: node scripts/build-lyrics-sidecar.mjs
      - run: npm run build
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      # --workspace everywhere below: src-tauri is a non-virtual workspace
      # root, so bare cargo commands cover ONLY the app package and would
      # silently skip the lyrics sidecar (a bin-target member — its whole
      # test suite lives under --bins).
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --workspace --lib --bins
        working-directory: src-tauri

  audit:
    # Dependency vulnerabilities, both ecosystems. Non-blocking would defeat
    # the point, so these fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri
