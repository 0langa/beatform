name: Release installers

# Every tagged release gets CI-built Windows installers. Idempotent by
# design: assets that already exist on the release (e.g. hand-uploaded from
# a local build) are left alone, so this can coexist with local releasing.
#
# workflow_dispatch is the webhook-outage escape hatch (2026-08-06: GitHub
# throttled push webhooks and tag pushes stopped triggering runs). Dispatch
# runs are API-created, so they fire even when push events are dropped:
#   gh workflow run "Release installers" --ref main -f tag=v2.74.0
# The tag must already exist; the whole job runs on that tag's tree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v2.74.0)"
        required: true
        type: string

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Tag-push runs take their tag from the ref; dispatch runs from the
      # input (inputs is empty on push events, so || falls through).
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The ProRes sidecar (~110 MB, gitignored) — tauri build fails without it
      - run: node scripts/fetch-ffmpeg.mjs

      # The lyrics pipeline (FEAT-004, all gitignored): whisper-cli build,
      # onnxruntime+DirectML runtime, and the sidecar exe itself
      - run: node scripts/fetch-whisper.mjs
      - run: node scripts/fetch-onnxruntime.mjs
      - run: node scripts/build-lyrics-sidecar.mjs

      # The SAME gate set as ci.yml (canonical definition: GATES.md §5).
      # Running a smaller one here is how two releases shipped off a main
      # that was failing `format:check` — a red main was invisible at
      # release time because the release path enforced a different contract.
      # If a gate is worth blocking a PR, it is worth blocking a release.
      # (npm run build is covered below: tauri build runs it as
      # beforeBuildCommand.)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --workspace --lib --bins
        working-directory: src-tauri

      # The signing key produces the .sig updater artifacts the in-app
      # auto-updater verifies against the pubkey pinned in tauri.conf.json.
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has an empty password, but the CLI PROMPTS interactively
          # when this var is unset — which hangs a headless build forever.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Stage assets with clean names
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist-release
          cp "src-tauri/target/release/bundle/nsis/Beatform_${VERSION}_x64-setup.exe" \
             "dist-release/Beatform_${VERSION}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/msi/Beatform_${VERSION}_x64_en-US.msi" \
             "dist-release/Beatform_${VERSION}_x64_en-US.msi"
          (cd dist-release && sha256sum *.exe *.msi > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # latest.json is what installed apps poll (releases/latest/download/
      # latest.json). NSIS-only by policy: Tauri's silent in-place update is
      # built around the NSIS installer; the MSI stays a manual/enterprise
      # option outside auto-update.
      - name: Build the updater manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          SIG_FILE="src-tauri/target/release/bundle/nsis/Beatform_${VERSION}_x64-setup.exe.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::updater signature missing — TAURI_SIGNING_PRIVATE_KEY secret not set?"
            exit 1
          fi
          export V="$VERSION"
          export SIG="$(cat "$SIG_FILE")"
          export URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Beatform_${VERSION}_x64-setup.exe"
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # notes = this version's own CHANGELOG section. The dialog normally
          # fetches the full cumulative changelog, but this blurb is what an
          # OFFLINE user reads, so it must be real human copy rather than a
          # bare link (which the notes renderer cannot make clickable).
          node -e "
            const fs = require('fs');
            const v = process.env.V;
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
            const head = '## [' + v + ']';
            let notes = '';
            const i = lines.findIndex((l) => l.startsWith(head));
            if (i >= 0) {
              let j = i + 1;
              while (j < lines.length && !lines[j].startsWith('## [')) j++;
              notes = lines.slice(i + 1, j).join('\n').trim();
            }
            if (!notes) {
              console.log('::warning::no CHANGELOG section for ' + v + ' — falling back to a link');
              notes = 'See the release notes: https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/tag/v' + v;
            }
            fs.writeFileSync('dist-release/latest.json', JSON.stringify({
              version: v,
              notes,
              pub_date: process.env.PUB_DATE,
              platforms: { 'windows-x86_64': { signature: process.env.SIG, url: process.env.URL } },
            }, null, 2));
          "
          cat dist-release/latest.json

      - name: Attach to the GitHub release (create draft if missing, skip existing assets)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if ! gh release view "$TAG" --json name >/dev/null 2>&1; then
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi
          EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in dist-release/*; do
            name=$(basename "$f")
            if grep -qxF "$name" <<<"$EXISTING"; then
              echo "skip (exists): $name"
            else
              gh release upload "$TAG" "$f"
              echo "uploaded: $name"
            fi
          done
