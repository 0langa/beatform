# Automated dependency + Action updates. Pairs with the SHA-pinned actions in
# the workflows: pinning to a commit is the supply-chain win, and Dependabot is
# what keeps a pin from silently going stale by proposing the next SHA. Grouped
# and capped so review stays light for a solo maintainer — majors still arrive
# as individual PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # webview2-com and windows-core must move in LOCKSTEP with wry, which
      # pins webview2-com ^0.38 (checked through wry 0.56.1, 2026-08-14). An
      # app-side bump alone puts two incompatible copies of the WebView2 type
      # graph in one build — dependabot PRs #13/#15 failed CI on exactly that
      # (E0308). We bump both by hand, together, when the tauri/wry stack
      # moves; cargo's version resolution forces the moment on us anyway.
      # Patch updates stay allowed so a CVE fix on the current line arrives.
      - dependency-name: "webview2-com"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
