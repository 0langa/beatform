[workspace]
# The app package is the workspace root; the lyrics sidecar (FEAT-004) builds
# as a separate exe exactly like the ffmpeg sidecar ships as a separate exe —
# one workspace so fmt/clippy/test cover both in one invocation.
members = ["lyrics-sidecar"]

[package]
name = "beatform"
version = "2.106.0"
description = "Local-first music visualizer — realtime preview and deterministic offline export from one engine."
authors = ["0langa"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "beatform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.0"
walkdir = "2.5.0"
cpal = "0.18.1"
base64 = "0.23"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
naga = { version = "30", features = ["glsl-in", "spv-in", "wgsl-out"] }
# Perf overlay stats (CPU/RAM/disk). "system" only — no disk-list, network,
# component or gpu features; the overlay needs processes + memory + cpu.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Lyrics model manager (lyrics.rs): resumable, SHA-256-verified downloads
# from the Beatform-owned models release. EXACTLY the updater's TLS recipe
# (reqwest rustls-no-provider + rustls/ring): all three crates are already
# in the tree via tauri-plugin-updater, so this adds no new tree entries —
# reqwest's plain `rustls` feature would drag in the aws-lc-rs/quinn subtree.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.11"

[target."cfg(windows)".dependencies]
# Web MIDI permission handler (midi_permission.rs): Chromium denies
# requestMIDIAccess unless the WebView2 PermissionRequested event grants it.
# Versions track what wry/tauri already pull in — no new tree entries.
webview2-com = "0.38"
windows-core = "0.61"
# Uninstall-entry self-heal (uninstall_entry.rs): DisplayVersion went
# stale across five auto-updates (ALIGN-002). Version tracks the tree's
# existing winreg — no new tree entries.
winreg = "0.56"
